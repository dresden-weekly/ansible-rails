---
- name: Debian | Restart required
  when: rails_unicorn_restart.stat.exists
  block:
    - name: Debian | Remove RAILS_APP_RESTART_PATH
      ansible.builtin.file:
        path: "{{ RAILS_APP_RESTART_PATH }}"
        state: absent

    - name: Debian | Upstart | Restart
      ansible.builtin.shell: "{{ profile }}'restart unicorn || start unicorn'"
      changed_when: true
      when: unicorn_service_type == 'upstart'

    - name: Debian | Systemd | Restart
      ansible.builtin.command: "{{ profile }}'systemctl --user restart {{ unicorn_service_name }}.service'"
      changed_when: true
      when: unicorn_service_type == 'systemd'
