---
- name: Variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Redhat
  ansible.builtin.include_tasks: RedHat-packages.yml
  when: ansible_os_family == "RedHat"
- name: Debian
  ansible.builtin.include_tasks: Debian-packages.yml
  when: ansible_os_family == "Debian"

- name: Install rbenv
  ansible.builtin.git:
    repo: "https://github.com/sstephenson/rbenv.git"
    dest: "~/.rbenv"
    depth: 1
  become: true
  become_user: "{{ rbenv_user }}"

- name: Install ruby-build
  ansible.builtin.git:
    repo: "https://github.com/sstephenson/ruby-build.git"
    dest: "~/.rbenv/plugins/ruby-build"
    depth: 1
  become: true
  become_user: "{{ rbenv_user }}"

- name: Ensure exists {{ rbenv_shell_rc }}
  ansible.builtin.command: "touch {{ rbenv_shell_rc }}"
  args:
    creates: "{{ rbenv_shell_rc }}"
  become: true
  become_user: "{{ rbenv_user }}"

- name: Export RBENV_ROOT in {{ rbenv_shell_rc }}
  ansible.builtin.lineinfile:
    dest: "{{ rbenv_shell_rc }}"
    regexp: "^export RBENV_ROOT="
    line: "export RBENV_ROOT=~/.rbenv"
  become: true
  become_user: "{{ rbenv_user }}"

- name: Put rbenv in users PATH in {{ rbenv_shell_rc }}
  ansible.builtin.lineinfile:
    dest: "{{ rbenv_shell_rc }}"
    regexp: "^PATH=\\$PATH:\\$RBENV_ROOT/bin"
    line: "PATH=$PATH:$RBENV_ROOT/bin"
  become: true
  become_user: "{{ rbenv_user }}"

- name: Put $RBENV_ROOT/shims in users $PATH in {{ rbenv_shell_rc }}
  ansible.builtin.lineinfile:
    dest: "{{ rbenv_shell_rc }}"
    regexp: "^PATH=\\$RBENV_ROOT/shims:\\$PATH"
    line: "PATH=$RBENV_ROOT/shims:$PATH"
  become: true
  become_user: "{{ rbenv_user }}"

- name: Install Rubies
  ansible.builtin.command: "{{ rbenv_ruby_configure_opts | default('') }} ~/.rbenv/bin/rbenv install {{ item }}"
  args:
    creates: "~/.rbenv/versions/{{ item }}"
  become: true
  become_user: "{{ rbenv_user }}"
  loop: "{{ rbenv_rubies + [rbenv_default] | flatten }}"

- name: Check default ruby
  ansible.builtin.shell:
    cmd: >
      set -o pipefail
      && ~/.rbenv/bin/rbenv version | grep -oE "^[^ ]+"
    executable: /bin/bash
  changed_when: false
  register: rbenv_current_version
  become: true
  become_user: "{{ rbenv_user }}"

- name: Set default ruby
  ansible.builtin.command: "~/.rbenv/bin/rbenv global {{ ruby_version }}"
  become: true
  become_user: "{{ rbenv_user }}"
  changed_when: true
  when: rbenv_current_version.stdout != ruby_version

- name: Check for Bundler
  ansible.builtin.command: '~/.rbenv/bin/rbenv exec bundle'
  failed_when: false
  changed_when: false
  register: rbenv_bundle_available
  become: true
  become_user: "{{ rbenv_user }}"

- name: Install Bundler
  ansible.builtin.command: "~/.rbenv/shims/gem install bundler"
  become: true
  become_user: "{{ rbenv_user }}"
  changed_when: true
  when: rbenv_bundle_available.rc != 0 and rbenv_bundle_available.rc != 10

- name: Facts
  ansible.builtin.set_fact:
    RUBY_PREFIX: '/home/{{ rbenv_user }}/.rbenv/bin/rbenv exec '
    RUBY_BIN: '/home/{{ rbenv_user }}/.rbenv/shims/ruby'
