#
# Define a release id, extract it from git and construct shared and custom folders
#
---
- name: Facts
  ansible.builtin.include_tasks: facts.yml
- name: Git
  ansible.builtin.include_tasks: git.yml

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Create custom folders
  ansible.builtin.file:
    path: "{{ RAILS_APP_RELEASE_PATH }}/{{ item }}"
    state: directory
    mode: "755"
  loop: "{{ rails_deploy_custom_create_folders | flatten }}"

- name: Provide Rails yaml configuration files
  ansible.builtin.template:
    dest: "{{ RAILS_APP_SHARED_PATH }}/{{ item.file }}"
    src: "config.yml.jinja2"
    owner: "{{ app_user }}"
    mode: "0600"
  when: item.yaml is defined
  loop: "{{ rails_provisioned_files }}"

- name: Provide plain configuration files
  ansible.builtin.copy:
    dest: "{{ RAILS_APP_SHARED_PATH }}/{{ item.file }}"
    content: "{{ item.plain }}"
    owner: "{{ app_user }}"
    mode: "0600"
  when: item.plain is defined
  loop: "{{ rails_provisioned_files }}"

- name: Shared Folders
  ansible.builtin.include_tasks: "shared_folders.yml"
