---
- name: Store facts
  ansible.builtin.set_fact:
    APP_URL: "{{ puma_app_url }}"
  tags: [always]

- name: Config puma.rb
  ansible.builtin.template:
    dest: "{{ puma_config_file }}"
    src: "puma.rb.j2"
    mode: "644"
  become: true
  become_user: "{{ puma_user }}"

- name: Service
  ansible.builtin.include_tasks: "{{ puma_service_type }}.yml"
