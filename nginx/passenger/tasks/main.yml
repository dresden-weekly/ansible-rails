- name: Pkg | Install nginx passenger packages
  ansible.builtin.apt:
    state: present
    pkg:
      - "nginx-extras"
      - "passenger"
    update_cache: "{{ repo_result.changed | bool }}"
  notify: Nginx restart

- name: Service | Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Config
  ansible.builtin.include_tasks: "config.yml"
